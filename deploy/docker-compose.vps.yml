# Pro Social AI — production stack for a single VPS.
#
#   docker compose -f deploy/docker-compose.vps.yml --env-file .env.selfhosted up -d
#
# Three services: the API, its PostgreSQL, and the nginx that serves the built
# dashboard and proxies /api to the API. No managed cloud service is involved.
#
# NOTHING IS HARDCODED TO AN EXISTING INSTALL. Container names, volume names,
# the published hostname and the project name all come from .env.selfhosted
# (see .env.selfhosted.example). This file was written without access to the
# VPS, so it must not assume the names already in use there — read section 11
# of VPS_DEPLOYMENT_HANDOFF.md before the first `up`, and in particular the
# note on adopting existing volumes rather than letting Compose create empty
# new ones.

name: ${COMPOSE_PROJECT_NAME:-pro-social-ai}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-pro-social-ai-postgres-1}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.selfhosted}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.selfhosted}
      POSTGRES_DB: ${POSTGRES_DB:-pro_social_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # `internal` only, and no `ports:` mapping. The database is reachable from
    # the API container and from nowhere else — publishing 5432 on a VPS is how
    # a Postgres ends up on the public internet.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: ${API_IMAGE:-pro-social-ai-api:local}
    # Docker's built-in init as PID 1, so nothing has to be installed in the
    # image for signals and zombie reaping to behave.
    init: true
    # nginx proxies to this name, so it must match the host in the
    # `proxy_pass` of nginx.vps.conf (default: api).
    container_name: ${API_CONTAINER_NAME:-pro-social-ai-api-1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      # The database connection travels as PARTS, never as a URL with the
      # password inside it. The API assembles and percent-encodes them (see
      # src/lib/env.ts), which means:
      #   * `docker compose config` never prints a connection string carrying
      #     the password — no output anyone has to squint at to tell a real
      #     value from a masked one;
      #   * a password containing @ : / ? # works, instead of silently
      #     producing an unparseable URL and an authentication failure.
      # The host is the compose service name: separate containers, not localhost.
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-pro_social_ai}
      MEDIA_ROOT: /app/media
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:?set SESSION_COOKIE_SECRET in .env.selfhosted}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL in .env.selfhosted}
      APP_NAME: ${APP_NAME:-Pro Social AI}
      # Providers. Every one is optional: an absent key disables its feature
      # and the API says so, rather than failing to start or pretending.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_TEXT_MODEL: ${OPENROUTER_TEXT_MODEL:-}
      GRAPHISTE_GPT_API_KEY: ${GRAPHISTE_GPT_API_KEY:-}
      GRAPHISTE_GPT_API_URL: ${GRAPHISTE_GPT_API_URL:-}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_API_URL: ${ZERNIO_API_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      CONTACT_TO: ${CONTACT_TO:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Subscriptions: where customers send Mobile Money payments. Public
      # values (shown on /abonnement), read by the API so a change needs a
      # restart, not a frontend rebuild. Each is a phone number or an
      # https:// payment link; unset channels are simply not offered.
      PAYMENT_WAVE: ${PAYMENT_WAVE:-}
      PAYMENT_ORANGE_MONEY: ${PAYMENT_ORANGE_MONEY:-}
      PAYMENT_MTN_MOMO: ${PAYMENT_MTN_MOMO:-}
      PAYMENT_MOOV_MONEY: ${PAYMENT_MOOV_MONEY:-}
      PAYMENT_BENEFICIARY: ${PAYMENT_BENEFICIARY:-}
    volumes:
      # User media lives on a volume, never inside the image: an image layer is
      # copied around and cached, user uploads must not be.
      - media:/app/media
    networks:
      - internal
    # No `ports:` either. The API is reached only through the frontend's /api
    # proxy, on the shared network below.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  # One-shot schema migration. NOT part of `up`: it runs only when asked for,
  #
  #   docker compose -f deploy/docker-compose.vps.yml --env-file .env.selfhosted \
  #     --profile migrate run --rm migrate
  #
  # Deliberately a separate command rather than something the API does on
  # boot. A container that migrates as it starts re-runs the schema on every
  # restart and on every replica at once, which is exactly the "dangerous
  # automatic migration" this deployment is supposed to avoid. Run it after
  # the backup in section 12 of the handoff, and before switching traffic.
  #
  # The migrations themselves are idempotent and recorded in a
  # schema_migrations table, so running this twice is a no-op, and running it
  # against an existing database applies only what is missing.
  migrate:
    image: ${API_IMAGE:-pro-social-ai-api:local}
    build:
      context: ../server
      dockerfile: Dockerfile
    profiles: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Same parts as the API, so both reach the same database by the same
      # rules. Never a URL with the password in it.
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-pro_social_ai}
      # Read at import time by the shared config module, though migrating does
      # not use it. A placeholder here would be a real value in .env.selfhosted.
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
    networks:
      - internal
    command: ["node", "dist/src/migrate.js"]

  frontend:
    image: nginx:1.27-alpine
    container_name: ${FRONTEND_CONTAINER_NAME:-auto-post-gen-frontend}
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      # The built dashboard, produced on the host by `npm run build`. Read-only:
      # nginx never writes here.
      - ${FRONTEND_DIST_PATH:-../dist}:/usr/share/nginx/html:ro
      - ${NGINX_CONF_PATH:-../nginx.vps.conf}:/etc/nginx/conf.d/default.conf:ro
    networks:
      # `web` for the reverse proxy that terminates TLS; `internal` so its
      # /api proxy can reach the API container by name.
      - web
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.auto-post-gen.rule=Host(`${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env.selfhosted}`)
      - traefik.http.routers.auto-post-gen.entrypoints=websecure
      - traefik.http.routers.auto-post-gen.tls=true
      - traefik.http.routers.auto-post-gen.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.auto-post-gen.loadbalancer.server.port=80

networks:
  # Created outside this file by the reverse proxy's own stack.
  web:
    external: true
  # Not reachable from the host or the internet; this is what keeps PostgreSQL
  # private while still letting the API talk to it.
  internal:
    driver: bridge

volumes:
  # `name:` is set explicitly so these do NOT get the compose project prefix
  # applied twice, and so an EXISTING volume can be adopted by naming it here
  # rather than starting from an empty one. Check what the VPS already has
  # (`docker volume ls`) before the first start.
  pgdata:
    name: ${PGDATA_VOLUME:-pro-social-ai_pgdata}
    external: ${VOLUMES_ARE_EXTERNAL:-false}
  media:
    name: ${MEDIA_VOLUME:-pro-social-ai_media}
    external: ${VOLUMES_ARE_EXTERNAL:-false}
