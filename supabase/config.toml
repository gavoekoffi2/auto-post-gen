# Every entry below is a deployed public endpoint. `verify_jwt = false` means
# the gateway lets the request through and the FUNCTION is responsible for
# authenticating it — so each one states what protects it.
#
# Functions with no product path to them are not left deployed: the direct
# per-platform OAuth flows (LinkedIn / Meta / Twitter) and the Ayrshare and
# Postiz connectors were removed when publishing moved to Zernio-only. They
# were unreachable from the app but still callable by anyone on the internet,
# and the OAuth callbacks wrote social tokens into the database. `git log` has
# them if a second provider is ever reinstated.

# generate-content is called by authenticated clients. We verify the user
# JWT inside the function (so the function can use the service role key
# to record usage), but Supabase's gateway should still require an apikey.
[functions.generate-content]
verify_jwt = true

# detect-audiences is called from onboarding/profile and validates the logged-in
# user before invoking Claude for segmentation.
[functions.detect-audiences]
verify_jwt = true

# generate-image is the asynchronous companion to generate-content; the
# dashboard calls it right after text generation so the image can stream
# in while the user already sees the post.
[functions.generate-image]
verify_jwt = true

# auto-generate-weekly is a cron-only entry point. Protected by CRON_SECRET.
[functions.auto-generate-weekly]
verify_jwt = false

# send-validation-email is cron-only. Protected by CRON_SECRET.
[functions.send-validation-email]
verify_jwt = false

# validate-post is hit from the email link without a session token.
# Token validation is done in-function (single-use + expiry + IP rate limit).
[functions.validate-post]
verify_jwt = false

# publish-post: manual triggers require user JWT (validated in-function),
# cron triggers use CRON_SECRET.
[functions.publish-post]
verify_jwt = false

# delete-account validates the user JWT in-function so it can call the
# admin API on their behalf.
[functions.delete-account]
verify_jwt = false

# export-account-data validates the user JWT in-function (GDPR data export).
[functions.export-account-data]
verify_jwt = false

# Zernio: the single social backend (connect + publish for LinkedIn, Facebook
# and 13 more). zernio-connect returns a hosted OAuth URL and enforces the
# plan's network limit; zernio-status lists the accounts connected under the
# user's Zernio profile. Both check the user JWT in-function.
[functions.zernio-connect]
verify_jwt = false

[functions.zernio-status]
verify_jwt = false

# send-contact: public contact form → operator inbox via Resend. No JWT
# (anonymous visitors), validated + honeypot-protected + IP rate-limited
# in-function.
[functions.send-contact]
verify_jwt = false

# Engagement: comment inbox sync + AI auto-reply. sync-comments runs from
# cron (CRON_SECRET) or a logged-in user; comment-reply requires a user JWT.
[functions.sync-comments]
verify_jwt = false

[functions.comment-reply]
verify_jwt = false

# Global owner control plane. The function validates the caller's JWT and
# requires server-owned app_metadata role=admin/super_admin.
[functions.admin-api]
verify_jwt = false
