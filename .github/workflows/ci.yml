name: CI

# Runs on every pull request (and pushes to main) so lint, tests and the
# production build are gated BEFORE merge — previously they only ran at deploy
# time, after code had already landed on main.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `npm run build` (vite) does NOT typecheck, so type errors used to
      # reach production unnoticed. Gate them explicitly.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The edge functions are deployed straight from this repo and are never
      # covered by the frontend build, so typecheck them here too.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
