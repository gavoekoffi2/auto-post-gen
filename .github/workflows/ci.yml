name: CI

# Runs on every pull request (and pushes to main) so lint, tests and the
# production build are gated BEFORE merge — previously they only ran at deploy
# time, after code had already landed on main.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Vite's build does not type-check; run tsc explicitly so type errors
      # cannot reach production (three were sitting in main undetected).
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Edge functions run on Deno and are never compiled by the frontend
      # toolchain: without this step a type error there is only discovered at
      # deploy time (or in production).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Supabase edge functions
        run: deno check supabase/functions/*/index.ts
