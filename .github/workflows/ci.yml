name: CI

# Runs on every pull request (and pushes to main) so lint, tests and the
# production build are gated BEFORE merge — previously they only ran at deploy
# time, after code had already landed on main.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `vite build` uses SWC, which strips types without checking them, so a
      # real type error could reach production with a green build. Run tsc.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Edge functions are Deno and are never touched by the Node build above, so
  # a type error in them used to surface only at deploy time.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts
