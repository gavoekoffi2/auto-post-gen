name: CI

# Runs on every pull request (and pushes to main) so lint, tests, types and the
# production build are gated BEFORE merge — previously they only ran at deploy
# time, after code had already landed on main.
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  # The dashboard. The test suite imports modules from server/src/shared, so it
  # needs the repo checked out but not the API's dependencies.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `vite build` uses SWC, which strips types without checking them, so a
      # real type error could reach production with a green build. Run tsc.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The whole point of the migration off Supabase: the shipped bundle must
      # carry no cloud backend and must call nothing but its own origin.
      - name: assert no Supabase dependency survives
        run: |
          set -euo pipefail
          if grep -rn "@supabase/supabase-js\|integrations/supabase\|VITE_SUPABASE" src/ package.json; then
            echo "::error::a Supabase dependency reappeared in the dashboard"
            exit 1
          fi
          if grep -rnE "supabase\.(auth|from|storage|functions)" src/; then
            echo "::error::a Supabase client call reappeared in the dashboard"
            exit 1
          fi
          if grep -rn "supabase" dist/ >/dev/null 2>&1; then
            echo "::error::the built bundle still references Supabase"
            exit 1
          fi

  # The API. Its tests need a real PostgreSQL: the guarantees they cover —
  # quota atomicity under a lock, the tenant predicate, the publish queue's
  # backoff, the capability token's unique index — cannot be checked by
  # reading the code, and a mock would assert only what the mock does.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SESSION_COOKIE_SECRET: ci-secret-that-is-long-enough-for-the-check
      MEDIA_ROOT: /tmp/psa-ci-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm run migrate
        working-directory: server

      # Migrations are replayed on every deploy against a database that already
      # carries the schema, so "idempotent" is a property the deploy depends on,
      # not a nicety. Applying each file twice more proves it.
      - name: migrations are idempotent
        run: |
          set -euo pipefail
          for pass in 2 3; do
            for file in server/migrations/*.sql; do
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
            done
            echo "replay pass $pass: ok"
          done

      - run: npm test
        working-directory: server
