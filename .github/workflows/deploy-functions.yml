name: Recover and deploy Supabase backend

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

concurrency:
  group: auto-post-gen-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      PROJECT_REF: tktoyntaeajgsuplhntd
      APP_ORIGIN: https://auto-post-gen.76.13.129.252.sslip.io
    steps:
      - uses: actions/checkout@v4

      - name: Verify Supabase access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Restore the project when paused
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"
          status="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "$api" | jq -r '.status // "UNKNOWN"')"
          echo "Supabase project status: $status"

          if [ "$status" = "INACTIVE" ]; then
            echo "Restoring paused Supabase project..."
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}' "$api/restore" >/dev/null
          fi

          for attempt in $(seq 1 60); do
            status="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "$api" | jq -r '.status // "UNKNOWN"')"
            echo "Readiness attempt $attempt: $status"
            case "$status" in
              ACTIVE_HEALTHY|ACTIVE) exit 0 ;;
              INACTIVE|REMOVED|UNKNOWN)
                if [ "$attempt" -gt 1 ]; then exit 1; fi
                ;;
            esac
            sleep 10
          done
          echo "::error::Supabase project did not become healthy in time."
          exit 1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure production authentication
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg origin "$APP_ORIGIN" \
            '{mailer_autoconfirm: true, site_url: $origin, uri_allow_list: ($origin + "/**")}' \
            > /tmp/auth-config.json
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/auth-config.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" >/dev/null

      - name: Configure production secrets and origins
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ZERNIO_API_KEY" ]; then
            echo "::error::ZERNIO_API_KEY is not configured."
            exit 1
          fi
          supabase secrets set \
            --project-ref "$PROJECT_REF" \
            ALLOWED_ORIGINS="$APP_ORIGIN" \
            APP_BASE_URL="$APP_ORIGIN" \
            ZERNIO_API_KEY="$ZERNIO_API_KEY"

      - name: Verify AI provider secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$PROJECT_REF" --output json > /tmp/runtime-secrets.json
          jq -r '.[].name' /tmp/runtime-secrets.json | sort | sed 's/^/Configured runtime secret: /'
          for required in GRAPHISTE_GPT_API_KEY OPENROUTER_API_KEY; do
            if ! jq -e --arg required "$required" 'any(.[]; .name == $required)' /tmp/runtime-secrets.json >/dev/null; then
              echo "::error::$required is missing from Supabase Edge Function secrets."
              exit 1
            fi
          done
          echo "Graphiste GPT is configured for poster generation; OpenRouter is configured for text generation."

      # Production's schema was reconciled by hand up to MIGRATION_CUTOFF, so
      # the older migrations are deliberately NOT replayed (several are not
      # idempotent and would fail against the live schema). Everything at or
      # after the cutoff IS replayed, in filename order, on every deploy.
      #
      # This used to be three hard-coded steps naming three migration files.
      # That meant a new migration reached production only if someone
      # remembered to add a fourth step — and an edge function shipped in the
      # same push would then reference a column that does not exist yet.
      # Migrations at or after the cutoff MUST be idempotent (IF NOT EXISTS /
      # OR REPLACE / DROP ... IF EXISTS first): they are re-applied every time.
      - name: Apply production migrations
        shell: bash
        env:
          MIGRATION_CUTOFF: "20260721000000"
        run: |
          set -euo pipefail

          # A migration dated BELOW the cutoff would never be applied, and the
          # failure would be silent — fail the deploy instead.
          newest_skipped=""
          for migration in supabase/migrations/*.sql; do
            stamp="$(basename "$migration" | cut -d_ -f1)"
            if [ "$stamp" \< "$MIGRATION_CUTOFF" ]; then newest_skipped="$stamp"; fi
          done
          if [ -n "$newest_skipped" ] && [ "$newest_skipped" \> "20260723000000" ]; then
            echo "::error::Migration $newest_skipped is below MIGRATION_CUTOFF and would never be applied."
            exit 1
          fi

          applied=0
          for migration in supabase/migrations/*.sql; do
            stamp="$(basename "$migration" | cut -d_ -f1)"
            if [ "$stamp" \< "$MIGRATION_CUTOFF" ]; then
              echo "Skipping (pre-cutoff, already in production): $migration"
              continue
            fi
            echo "Applying: $migration"
            jq -Rs '{query: .}' < "$migration" > /tmp/migration-query.json
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/migration-query.json \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" >/dev/null
            applied=$((applied + 1))
          done

          if [ "$applied" -eq 0 ]; then
            echo "::error::No migration was applied; the cutoff is probably wrong."
            exit 1
          fi
          echo "Applied $applied migration(s)."

      # Migrations below MIGRATION_CUTOFF are never replayed — they are assumed
      # to be already present in production. If that assumption is ever wrong
      # (a restored project, a fresh project, a hand-edited schema), the edge
      # functions deploy fine and then fail at runtime on a missing column,
      # which is invisible until a user hits it. Assert the schema the
      # functions actually depend on BEFORE deploying them.
      - name: Assert the production schema matches what the functions need
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/schema-assert.sql <<'SQL'
          WITH required_columns(tbl, col) AS (
            VALUES
              ('posts','scheduled_for'), ('posts','status'), ('posts','platforms'),
              ('posts','content_category'), ('posts','week_number'),
              ('posts','image_url'), ('posts','image_job_id'),
              ('posts','image_status_url'), ('posts','image_status'),
              ('posts','publish_error'), ('posts','auto_publish_attempted_at'),
              ('posts','publish_attempts'), ('posts','next_publish_attempt_at'),
              ('posts','provider_post_id'), ('posts','external_post_ids'),
              ('posts','validation_token'), ('posts','validation_token_used_at'),
              ('posts','validation_token_created_at'), ('posts','validation_email_sent_at'),
              ('profiles','plan'), ('profiles','auto_publish'), ('profiles','post_frequency'),
              ('profiles','preferred_days'), ('profiles','preferred_time'),
              ('profiles','promo_posts_per_week'), ('profiles','research_posts_per_week'),
              ('profiles','target_audiences'), ('profiles','audience_suggestions'),
              ('profiles','audiences_confirmed_at'), ('profiles','poster_footer_text'),
              ('profiles','brand_primary_color'), ('profiles','brand_secondary_color'),
              ('profiles','brand_accent_color'), ('profiles','logo_url'),
              ('profiles','custom_image_urls'), ('profiles','use_custom_images'),
              ('social_connections','provider'), ('social_connections','profile_key'),
              ('generation_usage','function_name'), ('generation_usage','status')
          ),
          required_routines(name) AS (
            VALUES ('consume_generation_quota'), ('recover_stuck_publishing'),
                   ('hit_ip_rate_limit'), ('handle_new_user')
          ),
          missing AS (
            SELECT rc.tbl || '.' || rc.col AS item
              FROM required_columns rc
             WHERE NOT EXISTS (
               SELECT 1 FROM information_schema.columns c
                WHERE c.table_schema = 'public'
                  AND c.table_name = rc.tbl
                  AND c.column_name = rc.col)
            UNION ALL
            SELECT 'function ' || rr.name
              FROM required_routines rr
             WHERE NOT EXISTS (
               SELECT 1 FROM pg_proc p
               JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname = 'public' AND p.proname = rr.name)
          )
          SELECT coalesce(string_agg(item, ', ' ORDER BY item), '') AS missing FROM missing;
          SQL
          jq -Rs '{query: .}' < /tmp/schema-assert.sql > /tmp/schema-assert.json
          missing="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/schema-assert.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" | jq -r '.[0].missing // ""')"
          if [ -n "$missing" ]; then
            echo "::error::Production schema is missing: $missing"
            echo "::error::These come from migrations below MIGRATION_CUTOFF. Apply them once by hand (Supabase SQL Editor), then re-run."
            exit 1
          fi
          echo "Production schema has every column and function the edge functions use."

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
