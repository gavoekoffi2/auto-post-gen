name: Recover and deploy Supabase backend

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

concurrency:
  group: auto-post-gen-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      PROJECT_REF: tktoyntaeajgsuplhntd
      APP_ORIGIN: https://auto-post-gen.76.13.129.252.sslip.io
      # Transactional SMTP for Supabase Auth (confirmation / recovery emails).
      # Set all four and email confirmation turns itself on — see the
      # "Configure production authentication" step. With Resend:
      #   SMTP_HOST=smtp.resend.com  SMTP_PORT=465  SMTP_USER=resend
      #   SMTP_PASS=<RESEND_API_KEY> SMTP_SENDER_EMAIL=no-reply@yourdomain
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
      SMTP_SENDER_NAME: Pro Social AI
    steps:
      - uses: actions/checkout@v4

      - name: Verify Supabase access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Restore the project when paused
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"
          status="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "$api" | jq -r '.status // "UNKNOWN"')"
          echo "Supabase project status: $status"

          if [ "$status" = "INACTIVE" ]; then
            echo "Restoring paused Supabase project..."
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}' "$api/restore" >/dev/null
          fi

          for attempt in $(seq 1 60); do
            status="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "$api" | jq -r '.status // "UNKNOWN"')"
            echo "Readiness attempt $attempt: $status"
            case "$status" in
              ACTIVE_HEALTHY|ACTIVE) exit 0 ;;
              INACTIVE|REMOVED|UNKNOWN)
                if [ "$attempt" -gt 1 ]; then exit 1; fi
                ;;
            esac
            sleep 10
          done
          echo "::error::Supabase project did not become healthy in time."
          exit 1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure production authentication
        shell: bash
        run: |
          set -euo pipefail

          # Email confirmation is turned ON as soon as a real SMTP sender is
          # configured, and only then. Flipping mailer_autoconfirm to false
          # without a working sender would lock every new user out of their own
          # account, so the safe default (autoconfirm) stands until the four
          # SMTP secrets exist.
          smtp_ready=false
          if [ -n "${SMTP_HOST:-}" ] && [ -n "${SMTP_USER:-}" ] \
             && [ -n "${SMTP_PASS:-}" ] && [ -n "${SMTP_SENDER_EMAIL:-}" ]; then
            smtp_ready=true
          fi

          if [ "$smtp_ready" = "true" ]; then
            echo "SMTP configured → enabling email confirmation."
            jq -n \
              --arg origin "$APP_ORIGIN" \
              --arg host "$SMTP_HOST" \
              --arg user "$SMTP_USER" \
              --arg pass "$SMTP_PASS" \
              --arg sender "$SMTP_SENDER_EMAIL" \
              --arg sender_name "${SMTP_SENDER_NAME:-Pro Social AI}" \
              --argjson port "${SMTP_PORT:-465}" \
              '{
                 mailer_autoconfirm: false,
                 site_url: $origin,
                 uri_allow_list: ($origin + "/**"),
                 password_min_length: 8,
                 smtp_host: $host,
                 smtp_port: ($port | tostring),
                 smtp_user: $user,
                 smtp_pass: $pass,
                 smtp_admin_email: $sender,
                 smtp_sender_name: $sender_name
               }' > /tmp/auth-config.json
          else
            echo "::warning::SMTP is not configured (SMTP_HOST/USER/PASS/SENDER_EMAIL).\
          Email confirmation stays OFF, so anyone can sign up with an address they do not own.\
          Add the four secrets to turn confirmation on automatically."
            jq -n \
              --arg origin "$APP_ORIGIN" \
              '{
                 mailer_autoconfirm: true,
                 site_url: $origin,
                 uri_allow_list: ($origin + "/**"),
                 password_min_length: 8
               }' > /tmp/auth-config.json
          fi

          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/auth-config.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" >/dev/null

      - name: Harden authentication policy (best effort)
        shell: bash
        run: |
          set -euo pipefail
          # Breached-password rejection (HaveIBeenPwned) and re-authentication
          # before a password change. Deliberately NOT fatal: these are extra
          # controls, and a rename in Supabase's management API must not be able
          # to block a deployment. A rejection is surfaced as a warning instead.
          payload='{"password_hibp_enabled":true,"security_update_password_require_reauthentication":true}'
          if curl --fail-with-body -sS -X PATCH \
               -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
               -H "Content-Type: application/json" \
               -d "$payload" \
               "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" >/tmp/auth-harden.json 2>&1; then
            echo "Breached-password protection and re-auth on password change are enabled."
          else
            echo "::warning::Could not apply the optional auth hardening flags; enable them"
            echo "::warning::manually in Supabase → Authentication → Policies. Response:"
            sed -n '1,10p' /tmp/auth-harden.json
          fi

      - name: Configure production secrets and origins
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ZERNIO_API_KEY" ]; then
            echo "::error::ZERNIO_API_KEY is not configured."
            exit 1
          fi
          supabase secrets set \
            --project-ref "$PROJECT_REF" \
            ALLOWED_ORIGINS="$APP_ORIGIN" \
            APP_BASE_URL="$APP_ORIGIN" \
            ZERNIO_API_KEY="$ZERNIO_API_KEY"

      - name: Verify AI provider secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$PROJECT_REF" --output json > /tmp/runtime-secrets.json
          jq -r '.[].name' /tmp/runtime-secrets.json | sort | sed 's/^/Configured runtime secret: /'
          for required in GRAPHISTE_GPT_API_KEY OPENROUTER_API_KEY; do
            if ! jq -e --arg required "$required" 'any(.[]; .name == $required)' /tmp/runtime-secrets.json >/dev/null; then
              echo "::error::$required is missing from Supabase Edge Function secrets."
              exit 1
            fi
          done
          echo "Graphiste GPT is configured for poster generation; OpenRouter is configured for text generation."

      - name: Apply the current editorial-mix migration
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260721000000_editorial_mix.sql"
          jq -Rs '{query: .}' < "$migration" > /tmp/editorial-mix-query.json
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/editorial-mix-query.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" >/dev/null

      - name: Apply audience-targeting migration
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260722000000_target_audiences.sql"
          jq -Rs '{query: .}' < "$migration" > /tmp/audience-targets-query.json
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/audience-targets-query.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" >/dev/null

      - name: Apply poster footer text migration
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260723000000_poster_footer_text.sql"
          jq -Rs '{query: .}' < "$migration" > /tmp/poster-footer-text-query.json
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/poster-footer-text-query.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" >/dev/null

      - name: Apply server-owned column lockdown migration
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260818000000_lock_server_owned_columns.sql"
          jq -Rs '{query: .}' < "$migration" > /tmp/column-lockdown-query.json
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/column-lockdown-query.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" >/dev/null

      - name: Apply profile server-column lockdown migration
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260818010000_lock_profile_server_columns.sql"
          jq -Rs '{query: .}' < "$migration" > /tmp/profile-lockdown-query.json
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/profile-lockdown-query.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" >/dev/null

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
