server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # connect-src is exactly 'self': the dashboard talks only to /api on this
  # same origin. It used to also allow the Supabase project host over https and
  # websockets, which kept that channel open at the policy level long after the
  # code stopped using it — so a reintroduced cloud call would have worked
  # instead of being blocked. Keep this directive free of any other host.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # The API, on the same origin. This is what makes the session cookie
  # usable without SameSite=None and removes any need for CORS — the whole
  # reason the dashboard calls relative /api paths.
  #
  # Without this block every /api request falls through to `location /`
  # below, which answers index.html with a 200. The dashboard then parses
  # HTML where it expects JSON and nothing works at all: no login, no posts,
  # no generation. It is the first thing to check if the site loads but every
  # action fails.
  #
  # The trailing slash on neither side is deliberate: `proxy_pass` without a
  # URI part forwards the original path unchanged, so /api/health reaches the
  # API as /api/health — which is where Fastify mounts it.
  # `/api` with no trailing slash is the same destination: without this exact
  # match it falls through to the SPA below and answers HTML with a 200.
  location = /api {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires -1;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Posters and logos travel through here; keep this in step with the API's
    # own upload ceiling, or nginx rejects the file before Fastify can say why.
    client_max_body_size 6m;

    # A poster render is asked for in async mode and polled, so no request
    # should be long — but a slow provider must not surface as a 504 mid-save.
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;

    # An API response is never a cacheable document.
    expires -1;
  }

  # The poster character: a phone photo is often larger than an ordinary
  # upload, and the API cuts it out before answering (a few seconds, more if
  # other cut-outs are queued). Same proxying as /api/, with the larger body
  # ceiling of that one route (CHARACTER_UPLOAD_MAX_BYTES, 12 MB, plus the
  # multipart envelope) and a longer read timeout.
  location = /api/profile/poster-character {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 13m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    expires -1;
  }

  # index.html must never be cached. Every build emits content-hashed asset
  # filenames and deletes the previous ones, so a browser holding a stale
  # index.html asks for bundles that no longer exist — a blank page that only
  # a hard refresh fixes. Nginx sends no Cache-Control for HTML by default,
  # which lets browsers cache it heuristically; be explicit instead.
  #
  # `expires -1` (which emits Cache-Control: no-cache) rather than add_header:
  # add_header in a location REPLACES the inherited set, so adding one here
  # would silently drop the CSP and HSTS above from the main document — the
  # one response where they matter most.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true,"service":"auto-post-gen-frontend"}';
  }

  # Content-hashed assets can be cached hard. Same reasoning as above: no
  # add_header here, so the security headers from the server block survive on
  # these responses too (the previous "public, immutable" add_header dropped
  # them). `expires 7d` already emits Cache-Control: max-age=604800.
  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    expires 7d;
    try_files $uri =404;
  }
}
