# Security headers, repeated in EVERY location that sets an add_header of its
# own.
#
# nginx does not append: `add_header` directives are inherited from the parent
# level ONLY when the current level declares none. So the moment a location
# adds a Cache-Control header, it silently drops every header from the server
# block. That bit this file: adding cache policy to the index.html, /assets/
# and static-file locations removed CSP, HSTS, X-Frame-Options and the rest
# from the one HTML document the whole app is served from — `GET /` resolves
# to /index.html through an internal redirect and matches that location.
#
# There is no "inherit and extend" mode; repeating them is the fix. Keep the
# three copies identical.
map $host $security_csp {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Don't advertise the nginx version in responses or error pages.
  server_tokens off;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy $security_csp always;

  # Compression. The app ships ~1 MB of JavaScript; gzipped that is closer to
  # 300 kB. The target market is mobile connections in West Africa, where that
  # difference is the first impression of the product.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    application/rss+xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must NEVER be cached. It is the file that names the hashed asset
  # bundles, so a stale copy sends the browser after files a deploy has already
  # removed — the classic blank page after a release. Everything it points at
  # is content-hashed, so the HTML is the only file that has to be re-fetched.
  location = /index.html {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $security_csp always;
    add_header Cache-Control "no-store, must-revalidate" always;
    expires -1;
  }

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true,"service":"auto-post-gen-frontend"}';
  }

  # ^~ matters: without it the regex location below wins for any .js/.css URL
  # (nginx evaluates regex before a plain prefix), and the hashed bundles would
  # silently get the 1-hour policy instead of the 1-year one.
  location ^~ /assets/ {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $security_csp always;
    add_header Cache-Control "public, immutable" always;
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  # Everything else static keeps a stable name (favicon, og-image, robots), so
  # it gets a short cache instead — long enough to help, short enough that
  # replacing one takes effect the same day.
  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?|txt)$ {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $security_csp always;
    add_header Cache-Control "public, max-age=3600" always;
    expires 1h;
    try_files $uri =404;
  }
}
